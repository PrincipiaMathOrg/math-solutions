      literature_dependencies:
        - "41 cited inputs, listed by kind and source in the docstring of Conditional.lean -- 18 cited machine computations (Platt; Platt-Trudgian; 16 of Helfgott's runs), 23 cited published theorems (Rosser, Rosser-Schoenfeld, McCurley, Trudgian, Ramare, Ramare-Saouter, Granville-Ramare, Montgomery, Montgomery-Vaughan 1973 and 1974); hypotheses, not proved; no step of Helfgott's argument is owed"

automation:
  methods:
    - method: "autonomous"
      models: []
      framework: "Principia Math harness"
      tool_setup: >-
        Autonomous multi-model research harness (coordinator + Lean agents). Statements were
        transcribed from the manuscript into a definitions-only layer first; proofs were then
        developed against those fixed statements and accepted only on a `#print axioms` gate.
      prompting_notes: >-
        Targets were the manuscript's labelled results. The statement layer
        (`Principia/Erdos1054/Statements/`, `Challenge.lean`) is kept separate from the proofs so
        that the statements being proved are fixed independently of the proof search.
  notes: >-
    The `models` list is left empty deliberately rather than guessed; per-declaration model
    attribution was not retained.

fidelity:
  divergences: >-
    (1) `thm:fraiture-representability` and `eq:exact-representability` are the same statement
    (`R = N \ {2, 5}`); in Lean `Thm_FraitureRepresentability` is an `abbrev` of
    `Eq_ExactRepresentability`. (2) The hypothesis `Cite_Helfgott_weighted` uses existential
    weights, which is weaker than Helfgott's fixed weights (see its docstring in
    `Principia/Erdos1054/Statements/Inputs.lean`). (3) In the 41-input form several links of
    Helfgott's chain are proved in CORRECTED form (the Main Theorem constant 0.896 route;
    corrected `lem:bogus`, `lem:yutto`; 10.25 for `lem:monro`'s 1.27), each implied by or weaker
    than what the source proves; the errata are listed in `VERIFICATION.md` section 8. (4) Seven results are unlabelled in the
    manuscript; they are identified by short descriptions below.

