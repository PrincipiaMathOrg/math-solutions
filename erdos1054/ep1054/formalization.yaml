status:
  scope: >-
    The manuscript has 37 numbered results. Each is stated in Lean as a `def ... : Prop` in
    `Principia/Erdos1054/Statements/*.lean` (definitions only). 33 are proved unconditionally,
    with axiom footprint [propext, Classical.choice, Quot.sound], and are Comparator targets
    (`comparator/`). The other 4 (`lem:fraiture-balanced-goldbach`, `prop:fraiture-tail`,
    `thm:fraiture-representability`, `eq:exact-representability`) rest in the paper on
    Helfgott's weighted ternary Goldbach theorem and are proved in Lean only CONDITIONALLY:
    (a) from one hypothesis encoding Helfgott's bound, and (b) without that hypothesis, from 41
    hypotheses every one of which is a cited input (18 cited machine computations, 23 cited
    published theorems), linked by owner decision and not re-proved in Lean; no step of
    Helfgott's argument is owed. This is a conditional verification, not a complete one. See
    `Conditional.lean` and `VERIFICATION.md`. No result is stated with
    an `axiom`; every assumption of a conditional result is an explicit binder. The sorry counts
    below exclude `Challenge.lean`, the statement-only Comparator fixture, whose 33 `sorry`s are
    intentional.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "EP1054.Thm_SmallUpper"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/Thm_SmallUpper.json"
      literature_dependencies: []
    - declaration: "EP1054.Thm_SmallValues"
