        - "Helfgott, The ternary Goldbach problem, arXiv:1312.7748, Sec. 7.4, (7.49)-(7.50) -- a HYPOTHESIS (`Principia.Erdos1054.Cite_Helfgott_weighted`), not proved"
    - declaration: "EP1054.Conditional.derivedClaims_of_atoms"
      file: "Conditional.lean"
      sorry_count: 0
